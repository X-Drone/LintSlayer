version: '3.8'

services:
  backend:
    build: ./
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lint_slayer
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lint_slayer
    ports:
      - "10001:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: