name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== FRONTEND ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./client
      
      - name: Setup .env for frontend
        run: |
          echo "VITE_BACKEND_URL=${{ secrets.BACKEND_URL }}" > ./client/.env.production
          echo "VITE_AUTH_URL_CLIENT=${{ secrets.AUTH_URL_CLIENT }}" >> ./client/.env.production
          echo "VITE_AUTH_URL_SERVER=${{ secrets.AUTH_URL_SERVER }}" >> ./client/.env.production

      - name: Build with Vite
        run: npm run build
        working-directory: ./client

      - name: Deploy frontend
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "client/dist/"
          target: "/volume1/web/lint_slayer/"
          rm: true
          overwrite: true


      # ========== BACKEND ==========
      - name: Deploy backend source
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/"
          target: "/volume1/web/lint_slayer/"
          rm: true
          overwrite: true
        
      - name: Setup .env for backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "DEBUG=false" >> /volume1/web/lint_slayer/server/.env
            echo "AUTH_URL=${{ secrets.AUTH_URL_SERVER }}" >> /volume1/web/lint_slayer/server/.env
            echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/lint_slayer" >> /volume1/web/lint_slayer/server/.env

      - name: Restart backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /volume1/web/lint_slayer/server
            docker-compose down
            docker-compose up -d --build
            echo "Backend started on port 3003"

      # ========== VERIFY ==========
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ls -la /volume1/web/lint_slayer
            echo "Deployed successfully"